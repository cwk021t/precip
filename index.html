<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720">
<meta name="mobile-web-app-capable" content="yes">
<title>Precip Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>">
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#2a3746;--tx:#e6edf3;--mut:#8b9bab;--rain:#4aa3ff;--snow:#c9b8ff;--warn:#ffb347;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Roboto,sans-serif;padding:12px 12px 40px;max-width:640px;margin:auto}
h1{font-size:20px;margin:4px 0}
h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
button,input{font:inherit;color:var(--tx);background:#223041;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
button{cursor:pointer}button.pri{background:#2563eb;border-color:#2563eb}
input{width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.tile .l{color:var(--mut);font-size:12px;text-transform:uppercase}
.tile .r{color:var(--rain);font-size:22px;font-weight:700}
.tile .s{color:var(--snow);font-size:14px}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.alert.info{background:#16324f;border:1px solid #24527f}
.alert.warn{background:#4a3410;border:1px solid var(--warn)}
.alert.bad{background:#4a1616;border:1px solid var(--bad)}
canvas{width:100%;height:150px;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--mut);font-size:11px}
.cal .d{min-height:50px;background:#1d2937;border-radius:8px;padding:3px;font-size:11px;cursor:pointer;position:relative}
.cal .d.e{background:none;cursor:default}
.cal .d.t{outline:2px solid #2563eb}
.cal .d .n{color:var(--mut)}
.cal .d .v{color:var(--rain);font-weight:600;font-size:12px}
.cal .d .sn{color:var(--snow)}
.cal .d .g{position:absolute;top:2px;right:4px;color:var(--warn);font-size:10px}
.mon{display:grid;grid-template-columns:40px 1fr 90px;gap:6px;align-items:center;font-size:13px;margin:3px 0}
.bar{height:10px;border-radius:5px;background:var(--rain)}
.row{display:flex;gap:8px;align-items:center;margin:8px 0}
.row>*{flex:1}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:14px;width:min(92vw,380px)}
dialog::backdrop{background:#0009}
label{font-size:13px;color:var(--mut)}
.legend span{margin-right:12px;font-size:12px}
</style>
</head>
<body>
<div class="top">
  <div><h1>💧 Precip Log</h1><div id="status" class="mut">Loading…</div></div>
  <button id="refresh">↻</button>
</div>

<div id="alerts"></div>

<div class="tiles" id="tiles"></div>

<div class="card">
  <h2>Next 48 hours</h2>
  <canvas id="chart"></canvas>
  <div class="legend mut"><span style="color:var(--rain)">■ rain</span><span style="color:var(--snow)">■ snow (liquid)</span><span>— chance %</span></div>
</div>

<div class="card">
  <div class="top"><button id="prev">‹</button><h2 id="monthTitle" style="margin:0"></h2><button id="next">›</button></div>
  <div class="cal" id="cal" style="margin-top:10px"></div>
  <div class="mut" style="margin-top:6px">Tap a day to enter your own gauge reading. ● = gauge value</div>
</div>

<div class="card">
  <h2 id="yearTitle">This year</h2>
  <div id="year"></div>
</div>

<details class="card">
  <summary><b>Settings</b></summary>
  <div class="row"><div><label>Latitude</label><input id="lat" inputmode="decimal"></div><div><label>Longitude</label><input id="lon" inputmode="decimal"></div></div>
  <div class="row"><button id="gps">📍 Use my location</button></div>
  <div class="row"><div><label>Heavy-precip alert threshold (inches / 24 h)</label><input id="thr" inputmode="decimal"></div></div>
  <div class="row"><button class="pri" id="saveSet">Save settings</button></div>
  <div class="row"><button id="csv">Export CSV</button><button id="reset">Reset log</button></div>
  <div class="mut">Data: Open-Meteo (free, no key). Estimates are model/radar-based for your exact coordinates; gauge entries override them.</div>
</details>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div class="mut" id="dlgModel"></div>
  <div class="row"><div><label>Rain (in)</label><input id="gRain" inputmode="decimal"></div><div><label>Snow depth (in)</label><input id="gSnow" inputmode="decimal"></div></div>
  <div class="row"><button class="pri" id="gSave">Save</button><button id="gClear">Use estimate</button><button id="gCancel">Cancel</button></div>
</dialog>

<script>
const KEY='precip-log-v1';
const DEF={lat:40.63,lon:-89.33,threshold:1,days:{}};
let S=load(), H=null, OFF=0, viewMonth=null;
const $=id=>document.getElementById(id);

function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days)return s}catch(e){}return JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){status('Could not save to this browser')}}
function status(t){$('status').textContent=t}
const r2=x=>Math.round((+x||0)*100)/100;
const localNow=()=>new Date(Date.now()+OFF*1000).toISOString().slice(0,16);
const todayStr=()=>localNow().slice(0,10);
function addDays(s,n){const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function fmtHour(t){let h=+t.slice(11,13);const ap=h<12?'AM':'PM';h=h%12||12;return h+' '+ap}
const fmtR=x=>x.toFixed(2)+'"', fmtS=x=>x.toFixed(1)+'"';

// Effective values for a day (gauge overrides model)
function val(k){
  const d=S.days[k]; if(!d) return null;
  const rain=d.gr!=null?d.gr:d.r, snow=d.gs!=null?d.gs:d.s;
  const snowLiquid=d.gs!=null?d.gs/10:Math.max(0,(d.p||0)-(d.r||0));
  return {rain,snow,liquid:rain+snowLiquid,gauge:d.gr!=null||d.gs!=null};
}
function sum(from,to){let r=0,s=0,l=0;for(const k in S.days){if(k>=from&&k<=to){const v=val(k);r+=v.rain;s+=v.snow;l+=v.liquid}}return{rain:r,snow:s,liquid:l}}

async function refresh(){
  status('Updating…');
  try{
    const q=new URLSearchParams({latitude:S.lat,longitude:S.lon,timezone:'auto',past_days:92,forecast_days:3,precipitation_unit:'inch',
      daily:'precipitation_sum,rain_sum,showers_sum,snowfall_sum',
      hourly:'precipitation,rain,showers,snowfall,precipitation_probability'});
    const res=await fetch('https://api.open-meteo.com/v1/forecast?'+q);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const d=await res.json();
    H=d.hourly; OFF=d.utc_offset_seconds||0;
    const today=todayStr(), nowH=localNow().slice(0,13);
    d.daily.time.forEach((t,i)=>{
      if(t>=today) return;
      const day=S.days[t]||{};
      day.r=r2((d.daily.rain_sum[i]||0)+(d.daily.showers_sum[i]||0));
      day.s=r2(d.daily.snowfall_sum[i]||0);
      day.p=r2(d.daily.precipitation_sum[i]||0);
      S.days[t]=day;
    });
    // Today so far, from hourly data up to the current hour
    let r=0,s=0,p=0;
    H.time.forEach((t,i)=>{if(t.slice(0,10)===today&&t.slice(0,13)<=nowH){r+=(H.rain[i]||0)+(H.showers[i]||0);s+=H.snowfall[i]||0;p+=H.precipitation[i]||0}});
    S.days[today]=Object.assign(S.days[today]||{},{r:r2(r),s:r2(s),p:r2(p)});
    await backfill(today, d.daily.time[0]);
    S.updated=Date.now(); save(); render();
  }catch(e){status('Update failed ('+e.message+') — showing saved data');render()}
}

// Fill Jan 1 → 92 days ago from the free historical archive (once per location/year)
async function backfill(today, firstFc){
  const start=today.slice(0,4)+'-01-01', tag=start+'|'+S.lat+','+S.lon;
  if(start>=firstFc||S.backfilled===tag) return;
  try{
    const q=new URLSearchParams({latitude:S.lat,longitude:S.lon,timezone:'auto',start_date:start,end_date:addDays(firstFc,-1),
      precipitation_unit:'inch',daily:'precipitation_sum,rain_sum,snowfall_sum'});
    const res=await fetch('https://archive-api.open-meteo.com/v1/archive?'+q);
    if(!res.ok) return;
    const d=await res.json();
    d.daily.time.forEach((t,i)=>{
      if(S.days[t]&&S.days[t].r!=null) return;
      S.days[t]=Object.assign(S.days[t]||{},{r:r2(d.daily.rain_sum[i]),s:r2(d.daily.snowfall_sum[i]),p:r2(d.daily.precipitation_sum[i])});
    });
    S.backfilled=tag;
  }catch(e){}
}

function render(){
  const today=todayStr();
  if(!viewMonth) viewMonth=today.slice(0,7);
  if(S.updated) status('Updated '+new Date(S.updated).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+' · '+(+S.lat).toFixed(2)+', '+(+S.lon).toFixed(2));
  // Tiles
  const tiles=[['Today so far',today,today],['Last 7 days',addDays(today,-6),today],['This month',today.slice(0,7)+'-01',today],['Year to date',today.slice(0,4)+'-01-01',today]];
  $('tiles').innerHTML=tiles.map(([l,a,b])=>{const v=sum(a,b);return `<div class="tile"><div class="l">${l}</div><div class="r">${fmtR(v.rain)}</div><div class="s">❄ ${fmtS(v.snow)} snow</div></div>`}).join('');
  renderAlerts(); drawChart(); renderCal(); renderYear();
}

function renderAlerts(){
  const out=[];
  if(H){
    const nowH=localNow().slice(0,13);
    const i0=H.time.findIndex(t=>t.slice(0,13)>nowH);
    if(i0>0){
      let rr=0,ss=0,start=null,pmax=0,next24=0,past24=0;
      for(let i=i0;i<i0+6&&i<H.time.length;i++){
        const r=(H.rain[i]||0)+(H.showers[i]||0), s=H.snowfall[i]||0;
        if(!start&&(r>=0.01||s>=0.1)) start=H.time[i];
        rr+=r; ss+=s; pmax=Math.max(pmax,H.precipitation_probability[i]||0);
      }
      for(let i=i0;i<i0+24&&i<H.time.length;i++) next24+=H.precipitation[i]||0;
      for(let i=Math.max(0,i0-24);i<i0;i++) past24+=H.precipitation[i]||0;
      if(start) out.push(['info',`${ss>=0.1?'❄️ Snow':'🌧️ Rain'} expected around ${fmtHour(start)}. Next 6 h: ${fmtR(rr)} rain${ss>0?', '+fmtS(ss)+' snow':''} (up to ${pmax}% chance).`]);
      if(past24>=S.threshold) out.push(['bad',`⚠️ ${fmtR(past24)} of precipitation in the last 24 hours, over your ${fmtR(+S.threshold)} threshold.`]);
      if(next24>=S.threshold) out.push(['warn',`⚠️ ${fmtR(next24)} forecast in the next 24 hours, over your ${fmtR(+S.threshold)} threshold.`]);
    }
  }
  $('alerts').innerHTML=out.map(([c,t])=>`<div class="alert ${c}">${t}</div>`).join('');
}

function drawChart(){
  const c=$('chart'), dpr=window.devicePixelRatio||1, W=c.clientWidth, Ht=150;
  c.width=W*dpr; c.height=Ht*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr); g.clearRect(0,0,W,Ht);
  if(!H){return}
  const nowH=localNow().slice(0,13);
  let i0=H.time.findIndex(t=>t.slice(0,13)>=nowH); if(i0<0) return;
  const n=Math.min(48,H.time.length-i0), pad=18, bw=(W)/n;
  let max=0.1; for(let i=0;i<n;i++) max=Math.max(max,H.precipitation[i0+i]||0);
  const cs=getComputedStyle(document.documentElement);
  g.font='10px system-ui'; g.fillStyle=cs.getPropertyValue('--mut');
  g.fillText(max.toFixed(2)+'"/h',2,10);
  for(let i=0;i<n;i++){
    const k=i0+i, p=H.precipitation[k]||0, snow=(H.snowfall[k]||0)>0;
    const h=(p/max)*(Ht-pad-14);
    g.fillStyle=snow?cs.getPropertyValue('--snow'):cs.getPropertyValue('--rain');
    g.fillRect(i*bw+1,Ht-pad-h,Math.max(1,bw-2),h);
    if(H.time[k].slice(11,13)%6===0){g.fillStyle=cs.getPropertyValue('--mut');g.fillText(fmtHour(H.time[k]),i*bw,Ht-4)}
  }
  g.strokeStyle='#ffffff55'; g.beginPath();
  for(let i=0;i<n;i++){const pr=(H.precipitation_probability[i0+i]||0)/100, y=Ht-pad-pr*(Ht-pad-14), x=i*bw+bw/2; i?g.lineTo(x,y):g.moveTo(x,y)}
  g.stroke();
}

function renderCal(){
  const [y,m]=viewMonth.split('-').map(Number), today=todayStr();
  $('monthTitle').textContent=new Date(Date.UTC(y,m-1,1)).toLocaleString([], {month:'long',year:'numeric',timeZone:'UTC'});
  const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(), dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  let h='SMTWTFS'.split('').map(x=>`<div class="h">${x}</div>`).join('');
  for(let i=0;i<first;i++) h+='<div class="d e"></div>';
  let mr=0,ms=0;
  for(let d=1;d<=dim;d++){
    const k=`${viewMonth}-${String(d).padStart(2,'0')}`, v=val(k);
    if(v){mr+=v.rain;ms+=v.snow}
    h+=`<div class="d${k===today?' t':''}" data-k="${k}"><div class="n">${d}</div>`+
      (v&&v.rain>=0.01?`<div class="v">${v.rain.toFixed(2)}</div>`:'')+
      (v&&v.snow>=0.1?`<div class="sn">❄${v.snow.toFixed(1)}</div>`:'')+
      (v&&v.gauge?'<span class="g">●</span>':'')+'</div>';
  }
  $('cal').innerHTML=h+`<div style="grid-column:1/-1" class="mut">Month: ${fmtR(mr)} rain · ${fmtS(ms)} snow</div>`;
  $('cal').querySelectorAll('.d[data-k]').forEach(el=>el.onclick=()=>openDay(el.dataset.k));
}

function renderYear(){
  const y=viewMonth.slice(0,4); $('yearTitle').textContent=y+' by month';
  const rows=[];let max=0.01;
  for(let m=1;m<=12;m++){const mm=`${y}-${String(m).padStart(2,'0')}`, v=sum(mm+'-01',mm+'-31');rows.push([mm,v]);max=Math.max(max,v.rain)}
  $('year').innerHTML=rows.map(([mm,v])=>`<div class="mon"><span>${new Date(mm+'-15T12:00Z').toLocaleString([], {month:'short',timeZone:'UTC'})}</span><div class="bar" style="width:${(v.rain/max*100).toFixed(0)}%"></div><span class="mut">${fmtR(v.rain)} · ❄${v.snow.toFixed(1)}</span></div>`).join('');
}

let editKey=null;
function openDay(k){
  if(k>todayStr()) return;
  editKey=k; const d=S.days[k]||{};
  $('dlgTitle').textContent=new Date(k+'T12:00Z').toLocaleDateString([], {weekday:'short',month:'short',day:'numeric',timeZone:'UTC'});
  $('dlgModel').textContent=d.r!=null?`Estimate: ${fmtR(d.r)} rain, ${fmtS(d.s)} snow`:'No estimate for this day';
  $('gRain').value=d.gr??''; $('gSnow').value=d.gs??'';
  $('dlg').showModal();
}
$('gSave').onclick=()=>{
  const d=S.days[editKey]||(S.days[editKey]={r:0,s:0,p:0});
  const r=$('gRain').value.trim(), s=$('gSnow').value.trim();
  if(r!=='') d.gr=r2(r); else delete d.gr;
  if(s!=='') d.gs=r2(s); else delete d.gs;
  save(); $('dlg').close(); render();
};
$('gClear').onclick=()=>{const d=S.days[editKey]; if(d){delete d.gr;delete d.gs} save(); $('dlg').close(); render()};
$('gCancel').onclick=()=>$('dlg').close();

$('prev').onclick=()=>{viewMonth=addDays(viewMonth+'-01',-1).slice(0,7);renderCal();renderYear()};
$('next').onclick=()=>{viewMonth=addDays(viewMonth+'-28',5).slice(0,7);renderCal();renderYear()};
$('refresh').onclick=refresh;

function fillSettings(){$('lat').value=S.lat;$('lon').value=S.lon;$('thr').value=S.threshold}
$('gps').onclick=()=>{
  if(!navigator.geolocation) return status('Location not available');
  navigator.geolocation.getCurrentPosition(p=>{$('lat').value=p.coords.latitude.toFixed(4);$('lon').value=p.coords.longitude.toFixed(4)},e=>status('Location error: '+e.message),{enableHighAccuracy:true});
};
$('saveSet').onclick=()=>{
  const lat=+$('lat').value, lon=+$('lon').value, thr=+$('thr').value;
  if(isNaN(lat)||isNaN(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return status('Invalid coordinates');
  const moved=Math.abs(lat-S.lat)>0.01||Math.abs(lon-S.lon)>0.01;
  if(moved&&Object.keys(S.days).length&&!confirm('Changing location starts a new log. Gauge entries will be cleared. Continue?')) return;
  if(moved){S.days={};delete S.backfilled}
  S.lat=lat;S.lon=lon;if(thr>0)S.threshold=thr;save();refresh();
};
$('csv').onclick=()=>{
  const rows=[['date','rain_in','snow_in','liquid_in','source']];
  Object.keys(S.days).sort().forEach(k=>{const v=val(k);rows.push([k,v.rain.toFixed(2),v.snow.toFixed(1),v.liquid.toFixed(2),v.gauge?'gauge':'estimate'])});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));
  a.download='precip-log.csv'; a.click();
};
$('reset').onclick=()=>{if(confirm('Delete all saved data, including gauge entries?')){S=JSON.parse(JSON.stringify(DEF));save();fillSettings();refresh()}};

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-(S.updated||0)>10*60e3)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},15*60e3);
window.addEventListener('resize',drawChart);
fillSettings(); render(); refresh();
</script>
</body>
</html>
